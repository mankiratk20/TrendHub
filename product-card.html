<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f0eb;
      font-family: 'Nunito', sans-serif;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      width: 260px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      transition: box-shadow 0.3s ease, transform 0.3s ease;
    }

    /* ── HOVER EFFECT ── */
    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.14);
    }

    .card-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }

    .card-body {
      padding: 18px 20px 22px;
    }

    .card-name {
      font-size: 1.05rem;
      font-weight: 800;
      color: #2e2e3a;
      margin-bottom: 6px;
    }

    .card-price {
      font-size: 1.25rem;
      font-weight: 900;
      color: #f4845f;
      margin-bottom: 18px;
    }

    .btn-cart {
      display: block;
      width: 100%;
      padding: 11px 0;
      background: #f4845f;
      color: #fff;
      font-family: 'Nunito', sans-serif;
      font-size: 0.95rem;
      font-weight: 800;
      border: none;
      border-radius: 50px;
      cursor: pointer;
    }

    .btn-cart:hover {
      background: #e06a45;
    }
  </style>
</head>
<body>

  <div class="card">
    <img
      class="card-img"
      src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600&q=80"
      alt="Stylish Red Sneaker"
    />
    <div class="card-body">
      <div class="card-name">Cloud Stride Sneakers</div>
      <div class="card-price">₹1,299</div>
      <button class="btn-cart">🛒 Add to Cart</button>
    </div>
  </div>

</body>
</html>
