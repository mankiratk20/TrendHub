<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TrendHub — Cart</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Pacifico&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background: #f5f0eb;
      color: #2e2e3a;
    }

    /* ── NAVBAR ── */
    nav {
      background: #fff;
      border-bottom: 2px solid #fde8d8;
      padding: 0 5%;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo { font-family: 'Pacifico', cursive; font-size: 1.6rem; color: #f4845f; }
    .logo span { color: #3cbfa0; }

    .cart-badge {
      background: #fff4c2;
      border: 2px solid #f5d96a;
      color: #b07e00;
      font-weight: 800;
      font-size: 0.9rem;
      padding: 8px 20px;
      border-radius: 50px;
    }

    /* ── LAYOUT ── */
    .page {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 30px;
      padding: 40px 5%;
      align-items: start;
    }

    /* ── SECTION TITLES ── */
    h2 {
      font-size: 1.3rem;
      font-weight: 900;
      margin-bottom: 20px;
    }
    h2 span { color: #f4845f; }

    /* ── PRODUCT GRID ── */
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 18px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      border: 2px solid #f0ece6;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 24px rgba(0,0,0,0.09);
    }

    .card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: block;
    }

    .card-body { padding: 14px 16px 16px; }

    .card-name {
      font-size: 0.95rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .card-price {
      font-size: 1rem;
      font-weight: 900;
      color: #f4845f;
      margin-bottom: 12px;
    }

    .btn-add {
      width: 100%;
      padding: 9px 0;
      background: #f4845f;
      color: #fff;
      border: none;
      border-radius: 50px;
      font-family: 'Nunito', sans-serif;
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-add:hover { background: #e06a45; }

    /* ── CART PANEL ── */
    .cart-panel {
      background: #fff;
      border-radius: 20px;
      border: 2px solid #f0ece6;
      padding: 24px 22px;
      position: sticky;
      top: 20px;
    }

    /* empty state */
    .empty-msg {
      text-align: center;
      color: #aaa;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 30px 0;
    }
    .empty-msg div { font-size: 2.5rem; margin-bottom: 8px; }

    /* cart items list */
    .cart-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .cart-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #f9f6f2;
      border-radius: 12px;
      padding: 10px 12px;
    }

    .cart-item img {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .item-info { flex: 1; }

    .item-name {
      font-size: 0.88rem;
      font-weight: 800;
      color: #2e2e3a;
    }

    .item-price {
      font-size: 0.82rem;
      color: #f4845f;
      font-weight: 700;
    }

    .item-qty {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .qty-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid #f0ece6;
      background: #fff;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2e2e3a;
      line-height: 1;
    }
    .qty-btn:hover { background: #fde8d8; border-color: #f4845f; }

    .qty-num {
      font-size: 0.9rem;
      font-weight: 900;
      min-width: 18px;
      text-align: center;
    }

    /* divider */
    .divider {
      border: none;
      border-top: 2px dashed #f0ece6;
      margin: 16px 0;
    }

    /* totals */
    .totals { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }

    .total-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.88rem;
      font-weight: 700;
      color: #7a7a8c;
    }

    .total-row.grand {
      font-size: 1.1rem;
      font-weight: 900;
      color: #2e2e3a;
    }

    .btn-checkout {
      width: 100%;
      padding: 13px 0;
      background: #3cbfa0;
      color: #fff;
      border: none;
      border-radius: 50px;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-checkout:hover { background: #2da88c; }

    .btn-clear {
      width: 100%;
      margin-top: 10px;
      padding: 10px 0;
      background: #fff;
      color: #f4845f;
      border: 2px solid #f4845f;
      border-radius: 50px;
      font-family: 'Nunito', sans-serif;
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-clear:hover { background: #fde8d8; }

    /* toast */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #2e2e3a;
      color: #fff;
      padding: 12px 28px;
      border-radius: 50px;
      font-weight: 800;
      font-size: 0.9rem;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav>
    <div class="logo">Trend<span>Hub</span></div>
    <div class="cart-badge" id="nav-count">🛒 Cart</div>
  </nav>

  <div class="page">

    <!-- PRODUCTS -->
    <div>
      <h2>Our <span>Products</span></h2>
      <div class="products" id="product-grid"></div>
    </div>

    <!-- CART PANEL -->
    <div class="cart-panel">
      <h2>Your <span>Cart</span></h2>

      <div id="cart-empty" class="empty-msg">
        <div>🛒</div>
        Your cart is empty.<br/>Add something!
      </div>

      <ul class="cart-list" id="cart-list" style="display:none;"></ul>

      <div id="cart-summary" style="display:none;">
        <hr class="divider"/>
        <div class="totals">
          <div class="total-row"><span>Subtotal</span><span id="subtotal">₹0</span></div>
          <div class="total-row"><span>Shipping</span><span id="shipping">₹0</span></div>
          <div class="total-row grand"><span>Total</span><span id="grand-total">₹0</span></div>
        </div>
        <button class="btn-checkout" onclick="checkout()">✔ Checkout</button>
        <button class="btn-clear" onclick="clearCart()">✕ Clear Cart</button>
      </div>
    </div>

  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script>
    /* ── STATIC PRODUCT DATA (array of objects) ── */
    var products = [
      { id: 1, name: "Cloud Stride Sneakers", price: 1299, img: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&q=80" },
      { id: 2, name: "Mini Canvas Backpack",  price: 899,  img: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=400&q=80" },
      { id: 3, name: "Retro Round Sunglasses",price: 549,  img: "https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=400&q=80" },
      { id: 4, name: "Minimal Dial Watch",    price: 2199, img: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400&q=80" },
      { id: 5, name: "Instant Film Camera",   price: 3499, img: "https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=400&q=80" },
      { id: 6, name: "Wireless Headphones",   price: 4999, img: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400&q=80" },
      { id: 7, name: "Matte Steel Bottle",    price: 699,  img: "https://images.unsplash.com/photo-1602143407151-7111542de6e8?w=400&q=80" },
      { id: 8, name: "Vanilla Soy Candle",    price: 349,  img: "https://images.unsplash.com/photo-1585386959984-a4155224a1ad?w=400&q=80" }
    ];

    /* ── CART ARRAY ── */
    // Each entry: { id, name, price, img, qty }
    var cart = [];

    /* ── RENDER PRODUCTS ── */
    function renderProducts() {
      var grid = document.getElementById("product-grid");
      var html = "";

      for (var i = 0; i < products.length; i++) {
        var p = products[i];
        html += '<div class="card">';
        html +=   '<img src="' + p.img + '" alt="' + p.name + '"/>';
        html +=   '<div class="card-body">';
        html +=     '<div class="card-name">' + p.name + '</div>';
        html +=     '<div class="card-price">₹' + p.price.toLocaleString() + '</div>';
        html +=     '<button class="btn-add" onclick="addToCart(' + p.id + ')">🛒 Add to Cart</button>';
        html +=   '</div>';
        html += '</div>';
      }

      grid.innerHTML = html;
    }

    /* ── ADD TO CART ── */
    function addToCart(productId) {
      // Find the product in the products array
      var product = null;
      for (var i = 0; i < products.length; i++) {
        if (products[i].id === productId) {
          product = products[i];
          break;
        }
      }
      if (!product) return;

      // Check if item already exists in cart array
      var found = false;
      for (var j = 0; j < cart.length; j++) {
        if (cart[j].id === productId) {
          cart[j].qty = cart[j].qty + 1;
          found = true;
          break;
        }
      }

      // If not found, push a new entry into cart array
      if (!found) {
        cart.push({ id: product.id, name: product.name, price: product.price, img: product.img, qty: 1 });
      }

      renderCart();
      saveCart();
      showToast("✔ " + product.name + " added!");
    }

    /* ── CHANGE QUANTITY ── */
    function changeQty(productId, delta) {
      for (var i = 0; i < cart.length; i++) {
        if (cart[i].id === productId) {
          cart[i].qty = cart[i].qty + delta;
          if (cart[i].qty <= 0) {
            // Remove item from array using splice
            cart.splice(i, 1);
          }
          break;
        }
      }
      renderCart();
      saveCart();
    }

    /* ── RENDER CART ── */
    function renderCart() {
      var listEl    = document.getElementById("cart-list");
      var emptyEl   = document.getElementById("cart-empty");
      var summaryEl = document.getElementById("cart-summary");

      if (cart.length === 0) {
        listEl.style.display    = "none";
        summaryEl.style.display = "none";
        emptyEl.style.display   = "block";
        document.getElementById("nav-count").textContent = "🛒 Cart (0)";
        return;
      }

      emptyEl.style.display   = "none";
      listEl.style.display    = "flex";
      summaryEl.style.display = "block";

      // Build cart list HTML
      var html = "";
      var totalItems = 0;
      var subtotal   = 0;

      for (var i = 0; i < cart.length; i++) {
        var item = cart[i];
        totalItems = totalItems + item.qty;
        subtotal   = subtotal + (item.price * item.qty);

        html += '<li class="cart-item">';
        html +=   '<img src="' + item.img + '" alt="' + item.name + '"/>';
        html +=   '<div class="item-info">';
        html +=     '<div class="item-name">' + item.name + '</div>';
        html +=     '<div class="item-price">₹' + (item.price * item.qty).toLocaleString() + '</div>';
        html +=   '</div>';
        html +=   '<div class="item-qty">';
        html +=     '<button class="qty-btn" onclick="changeQty(' + item.id + ', -1)">−</button>';
        html +=     '<span class="qty-num">' + item.qty + '</span>';
        html +=     '<button class="qty-btn" onclick="changeQty(' + item.id + ', 1)">+</button>';
        html +=   '</div>';
        html += '</li>';
      }

      listEl.innerHTML = html;

      // Calculate shipping (free above ₹999)
      var shipping = subtotal >= 999 ? 0 : 99;
      var grand    = subtotal + shipping;

      document.getElementById("subtotal").textContent    = "₹" + subtotal.toLocaleString();
      document.getElementById("shipping").textContent    = shipping === 0 ? "FREE 🎉" : "₹" + shipping;
      document.getElementById("grand-total").textContent = "₹" + grand.toLocaleString();
      document.getElementById("nav-count").textContent   = "🛒 Cart (" + totalItems + ")";
    }

    /* ── SAVE / LOAD CART ── */
    function saveCart() {
      localStorage.setItem("trendhub_cart", JSON.stringify(cart));
    }

    function loadCart() {
      var data = localStorage.getItem("trendhub_cart");
      cart = data ? JSON.parse(data) : [];
    }

    /* ── CLEAR CART ── */
    function clearCart() {
      cart = [];
      localStorage.removeItem("trendhub_cart");
      renderCart();
      showToast("🗑 Cart cleared!");
    }

    /* ── CHECKOUT ── */
    function checkout() {
      saveCart();
      window.location.href = "checkout.html";
    }

    /* ── TOAST NOTIFICATION ── */
    function showToast(msg) {
      var toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(function() {
        toast.classList.remove("show");
      }, 2000);
    }

    /* ── INIT ── */
    loadCart();
    renderProducts();
    renderCart();
  </script>
</body>
</html>
